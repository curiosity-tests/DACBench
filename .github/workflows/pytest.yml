name: tests
run-name: "tests ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development


permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Set up Python 
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install uv
        run: |
          python -m pip install uv
          uv venv
      - name: Activate virtualenv
        run: |
          . .venv/bin/activate
          which python
          echo PATH=$PATH >> $GITHUB_ENV
      - name: Install dependencies
        run:  |
          git submodule update --init --recursive
          uv pip install -e ".[dev, docs, all, example]"
      - name: Run tests with pytest
        run: /home/runner/work/DACBench/DACBench/.venv/bin/python -m pytest tests
